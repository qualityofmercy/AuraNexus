[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auranexus"
version = "0.1.0"
description = "AuraNexus: AI-powered SAP project lifecycle management engine (multi-agent, human-in-the-loop) on GCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "structlog>=24.1",
]

[project.optional-dependencies]
gcp = [
  "google-genai>=1.20",
  "google-cloud-pubsub>=2.21",
  "google-cloud-bigquery>=3.25",
  "google-auth>=2.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]
claude = ["anthropic[vertex]>=1.15"]  # only if a client wants Claude instead of Gemini
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/auranexus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "auranexus.api.auth.require"]
