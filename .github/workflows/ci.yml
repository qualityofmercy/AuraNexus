name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q --cov=auranexus --cov-report=term-missing
      - run: python scripts/gen_agent_catalog.py --check

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [shared-services, dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
      - run: terraform fmt -check -recursive modules environments
      - run: terraform init -backend=false -input=false
        working-directory: environments/${{ matrix.env }}
      - run: terraform validate
        working-directory: environments/${{ matrix.env }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
