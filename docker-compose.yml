# Local production-like stack: Postgres with row-level security + API. LLM is the offline fake unless you set
# AURANEXUS_LLM_BACKEND=gemini (and AURANEXUS_GCP_PROJECT) and mount ADC credentials.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auranexus
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auranexus"]
      interval: 3s
      retries: 20
    ports: ["5432:5432"]

  migrate:
    build: .
    command: ["python", "-m", "auranexus.migrate"]
    environment:
      AURANEXUS_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/auranexus
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    ports: ["8080:8080"]
    environment:
      AURANEXUS_ENV: local
      AURANEXUS_AUTH_MODE: dev
      AURANEXUS_STORE_BACKEND: postgres
      AURANEXUS_DATABASE_URL: postgresql+psycopg://auranexus_app:app@db:5432/auranexus
      AURANEXUS_LLM_BACKEND: fake
    depends_on:
      migrate: { condition: service_completed_successfully }
